<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a12"/>
      <stop offset="45%" stop-color="#0f2417"/>
      <stop offset="100%" stop-color="#08110c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CFC9C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7CFC9C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rampLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8affc1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8affc1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8affc1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <circle cx="180" cy="80" r="160" fill="url(#glow1)"/>
  <circle cx="1040" cy="300" r="200" fill="url(#glow2)"/>
  <circle cx="600" cy="40" r="120" fill="url(#glow1)"/>

  <g opacity="0.18" stroke="#8affc1" stroke-width="2" fill="none">
